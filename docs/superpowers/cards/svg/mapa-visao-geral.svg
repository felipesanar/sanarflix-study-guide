<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="Inter, Segoe UI, sans-serif" role="img" aria-label="Mapa da tela Visão Geral, com os blocos na ordem vertical e a Task que constrói cada um"><title>Mapa da tela — Visão Geral</title><desc>Ordem vertical dos blocos da Visão Geral e a Task responsável por cada um.</desc><rect width="760" height="590" fill="#EDEEF0"/><text x="28" y="34" font-size="10" font-weight="700" letter-spacing="1.3" fill="#899090">MAPA DA TELA · ordem vertical real</text><text x="28" y="58" font-size="18" font-weight="700" fill="#111212">Visão Geral</text><text x="28" y="76" font-size="11" fill="#899090">rota /gestor/visao-geral · macro no topo, micro embaixo</text><g font-size="12"><g><rect x="28" y="94" width="704" height="44" rx="10" fill="#F4F5F6" stroke="#E9EBED"/><rect x="40" y="106" width="34" height="20" rx="10" fill="#6632DC"/><text x="47" y="120" font-size="10" font-weight="700" fill="#FFFFFF">29</text><text x="86" y="114" font-weight="700" fill="#111212">Barra de filtros — FiltroSemestre</text><text x="86" y="129" font-size="11" fill="#414141">6º ano (padrão) · Geral · Por semestre. Vive na URL e atravessa as duas telas.</text></g><g><rect x="28" y="146" width="704" height="44" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="158" width="34" height="20" rx="10" fill="#B81414"/><text x="47" y="172" font-size="10" font-weight="700" fill="#FFFFFF">37</text><text x="86" y="166" font-weight="700" fill="#111212">Panorama — 4 indicadores</text><text x="86" y="181" font-size="11" fill="#414141">ENAMED projetado · proficientes · acerto · simulados. O card base é a Task 36.</text></g><g><rect x="28" y="198" width="704" height="52" rx="10" fill="#FFFFFF" stroke="#B81414" stroke-width="1.5"/><rect x="40" y="210" width="72" height="20" rx="10" fill="#B81414"/><text x="47" y="224" font-size="10" font-weight="700" fill="#FFFFFF">38·39·40·41</text><text x="124" y="218" font-weight="700" fill="#111212">Gráfico protagonista — 3 modos</text><text x="124" y="233" font-size="11" fill="#414141">Geral (linha) · Por grande área (linha, % de acerto) · Por aluno (dispersão).</text><text x="124" y="246" font-size="11" fill="#899090">A troca de modo NÃO refaz requisição: os três dados já vêm carregados.</text></g><g><rect x="28" y="258" width="704" height="52" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="270" width="48" height="20" rx="10" fill="#0374AE"/><text x="47" y="284" font-size="10" font-weight="700" fill="#FFFFFF">42·43</text><text x="100" y="278" font-weight="700" fill="#111212">Diagnóstico Curricular — cascata de 2 níveis</text><text x="100" y="293" font-size="11" fill="#414141">Grande área → especialidade, abrindo AO LADO (divide o grid), não em drawer.</text><text x="100" y="306" font-size="11" fill="#899090">Os temas só aparecem no DrawerTemas (43), a partir da especialidade.</text></g><g><rect x="28" y="318" width="704" height="44" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="330" width="34" height="20" rx="10" fill="#11A694"/><text x="47" y="344" font-size="10" font-weight="700" fill="#FFFFFF">44</text><text x="86" y="338" font-weight="700" fill="#111212">Visão de Alunos — distribuição + dispersão</text><text x="86" y="353" font-size="11" fill="#414141">Proficiente / em variação / não proficiente, e a dispersão com linha de tendência.</text></g><g><rect x="28" y="370" width="704" height="44" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="382" width="34" height="20" rx="10" fill="#D38808"/><text x="47" y="396" font-size="10" font-weight="700" fill="#FFFFFF">46</text><text x="86" y="390" font-weight="700" fill="#111212">Insights — leitura textual curta do recorte</text><text x="86" y="405" font-size="11" fill="#414141">Dois insights: um por área, um por aluno. Sem linguagem de aluno, sem checklist.</text></g><line x1="28" y1="424" x2="732" y2="424" stroke="#E9EBED" stroke-dasharray="3 3"/><text x="28" y="440" font-size="10" font-weight="700" letter-spacing="1.1" fill="#899090">DETALHE · MICRO</text><g><rect x="28" y="450" width="704" height="44" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="462" width="48" height="20" rx="10" fill="#149142"/><text x="47" y="476" font-size="10" font-weight="700" fill="#FFFFFF">45·45b</text><text x="100" y="470" font-weight="700" fill="#111212">Tabela de alunos + DrawerAluno</text><text x="100" y="485" font-size="11" fill="#414141">Busca, tag de grupo, proficiência por simulado, paginação. O nome abre o drawer.</text></g></g><rect x="28" y="510" width="704" height="60" rx="10" fill="#FFF7F7" stroke="#F3C9C9"/><text x="44" y="530" font-size="11" font-weight="700" fill="#B81414">A rota que junta tudo é a Task 46</text><text x="44" y="547" font-size="11" fill="#414141">Cada bloco tem loading, vazio e erro INDEPENDENTES — um bloco quebrado não apaga a tela.</text><text x="44" y="562" font-size="11" fill="#414141">Nunca aparece Nota TRI aqui, e área/especialidade/tema usam sempre % de acerto.</text></svg>
