<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Os 4 indicadores da Visão Geral na ordem canônica, com anotações">
  <title>Task 37 — Os 4 KPIs da Visão Geral na ordem canônica</title>
  <desc>Mock anotado da faixa de 4 indicadores: Conceito ENAMED projetado, Alunos proficientes, Percentual de acerto e Simulados realizados. Sete anotações numeradas explicam as regras que o componente precisa respeitar.</desc>

  <rect width="1000" height="600" fill="#EDEEF0"/>

  <!-- eyebrow -->
  <text x="32" y="38" font-size="11" font-weight="700" letter-spacing="1.4" fill="#899090">VISÃO GERAL · O QUE VOCÊ VAI CONSTRUIR</text>
  <text x="32" y="62" font-size="19" font-weight="700" fill="#111212">Panorama — 4 indicadores</text>

  <!-- ============ CARD 1: Conceito ENAMED ============ -->
  <g>
    <rect x="32" y="84" width="222" height="168" rx="16" fill="#FFFFFF" stroke="#E9EBED"/>
    <text x="52" y="110" font-size="12" font-weight="600" fill="#414141">Conceito ENAMED</text>
    <rect x="52" y="120" width="66" height="18" rx="9" fill="#FCE3E3"/>
    <text x="59" y="133" font-size="10" font-weight="700" fill="#B81414">projetado</text>
    <circle cx="232" cy="105" r="8" fill="#F4F5F6"/>
    <text x="229.5" y="109" font-size="10" font-weight="700" fill="#899090">i</text>
    <text x="52" y="152" font-size="10" fill="#899090">projeção institucional · escala 1 a 5</text>
    <text x="52" y="196" font-size="40" font-weight="800" fill="#111212" letter-spacing="-1.2">4</text>
    <text x="82" y="196" font-size="16" font-weight="700" fill="#899090">/5</text>
    <rect x="112" y="176" width="42" height="20" rx="10" fill="#E7F4EC"/>
    <text x="120" y="190" font-size="11" font-weight="700" fill="#0C5728">+1</text>
    <line x1="52" y1="212" x2="234" y2="212" stroke="#F1F2F4"/>
    <text x="52" y="230" font-size="9" fill="#899090">1º simulado</text>
    <text x="120" y="230" font-size="9" fill="#899090">anterior</text>
    <text x="180" y="230" font-size="9" font-weight="700" fill="#111212">atual</text>
    <text x="52" y="243" font-size="10" font-weight="700" fill="#414141">2</text>
    <text x="120" y="243" font-size="10" font-weight="700" fill="#414141">3</text>
    <text x="180" y="243" font-size="10" font-weight="700" fill="#111212">4</text>
  </g>

  <!-- ============ CARD 2: Alunos proficientes ============ -->
  <g>
    <rect x="270" y="84" width="222" height="168" rx="16" fill="#FFFFFF" stroke="#E9EBED"/>
    <text x="290" y="110" font-size="12" font-weight="600" fill="#414141">Alunos proficientes</text>
    <circle cx="470" cy="105" r="8" fill="#F4F5F6"/>
    <text x="467.5" y="109" font-size="10" font-weight="700" fill="#899090">i</text>
    <text x="290" y="152" font-size="10" fill="#899090">60 ou mais de proficiência</text>
    <text x="290" y="196" font-size="40" font-weight="800" fill="#111212" letter-spacing="-1.2">54%</text>
    <rect x="374" y="176" width="42" height="20" rx="10" fill="#E7F4EC"/>
    <text x="382" y="190" font-size="11" font-weight="700" fill="#0C5728">+3</text>
    <text x="290" y="214" font-size="10" fill="#899090">56 de 104</text>
    <line x1="290" y1="222" x2="472" y2="222" stroke="#F1F2F4"/>
    <text x="290" y="238" font-size="9" fill="#899090">1º simulado</text>
    <text x="358" y="238" font-size="9" fill="#899090">anterior</text>
    <text x="418" y="238" font-size="9" font-weight="700" fill="#111212">atual</text>
  </g>

  <!-- ============ CARD 3: Percentual de acerto ============ -->
  <g>
    <rect x="508" y="84" width="222" height="168" rx="16" fill="#FFFFFF" stroke="#E9EBED"/>
    <text x="528" y="110" font-size="12" font-weight="600" fill="#414141">Percentual de acerto</text>
    <circle cx="708" cy="105" r="8" fill="#F4F5F6"/>
    <text x="705.5" y="109" font-size="10" font-weight="700" fill="#899090">i</text>
    <text x="528" y="152" font-size="10" fill="#899090">questões certas no período</text>
    <text x="528" y="196" font-size="40" font-weight="800" fill="#111212" letter-spacing="-1.2">61%</text>
    <rect x="612" y="176" width="42" height="20" rx="10" fill="#E7F4EC"/>
    <text x="620" y="190" font-size="11" font-weight="700" fill="#0C5728">+2</text>
    <line x1="528" y1="222" x2="710" y2="222" stroke="#F1F2F4"/>
    <text x="528" y="238" font-size="9" fill="#899090">1º simulado</text>
    <text x="596" y="238" font-size="9" fill="#899090">anterior</text>
    <text x="656" y="238" font-size="9" font-weight="700" fill="#111212">atual</text>
  </g>

  <!-- ============ CARD 4: Simulados realizados ============ -->
  <g>
    <rect x="746" y="84" width="222" height="168" rx="16" fill="#FFFFFF" stroke="#E9EBED"/>
    <text x="766" y="110" font-size="12" font-weight="600" fill="#414141">Simulados realizados</text>
    <text x="766" y="152" font-size="10" fill="#899090">do contrato Academy 2026</text>
    <text x="766" y="196" font-size="40" font-weight="800" fill="#111212" letter-spacing="-1.2">3</text>
    <text x="790" y="196" font-size="16" font-weight="700" fill="#899090">/7</text>
    <!-- trilha -->
    <g>
      <rect x="766" y="212" width="24" height="6" rx="3" fill="#B81414"/>
      <rect x="794" y="212" width="24" height="6" rx="3" fill="#B81414"/>
      <rect x="822" y="212" width="24" height="6" rx="3" fill="#B81414"/>
      <rect x="850" y="212" width="24" height="6" rx="3" fill="#E9EBED"/>
      <rect x="878" y="212" width="24" height="6" rx="3" fill="#E9EBED"/>
      <rect x="906" y="212" width="24" height="6" rx="3" fill="#E9EBED"/>
      <rect x="934" y="212" width="24" height="6" rx="3" fill="#E9EBED"/>
    </g>
    <text x="766" y="240" font-size="11" font-weight="600" fill="#B81414">Ver cronograma</text>
    <line x1="766" y1="244" x2="845" y2="244" stroke="#B81414" stroke-width="0.8"/>
  </g>

  <!-- ============ PINS ============ -->
  <g font-size="11" font-weight="700" fill="#FFFFFF">
    <circle cx="40" cy="76" r="11" fill="#111212"/><text x="36.5" y="80">1</text>
    <circle cx="112" cy="129" r="11" fill="#B81414"/><text x="108.5" y="133">2</text>
    <circle cx="240" cy="226" r="11" fill="#0374AE"/><text x="236.5" y="230">3</text>
    <circle cx="424" cy="186" r="11" fill="#149142"/><text x="420.5" y="190">4</text>
    <circle cx="708" cy="87" r="11" fill="#6632DC"/><text x="704.5" y="91">5</text>
    <circle cx="954" cy="196" r="11" fill="#D38808"/><text x="950.5" y="200">6</text>
    <circle cx="290" cy="164" r="11" fill="#C61D1D"/><text x="286.5" y="168">7</text>
  </g>

  <!-- ============ LEGENDA ============ -->
  <rect x="32" y="276" width="936" height="292" rx="12" fill="#FFFFFF" stroke="#E9EBED"/>
  <text x="52" y="302" font-size="11" font-weight="700" letter-spacing="1.2" fill="#899090">O QUE CADA ANOTAÇÃO EXIGE</text>

  <g font-size="12">
    <circle cx="60" cy="326" r="9" fill="#111212"/><text x="56.5" y="330" font-size="10" font-weight="700" fill="#FFFFFF">1</text>
    <text x="80" y="323" font-weight="700" fill="#111212">A ordem dos 4 é fixa e testada</text>
    <text x="80" y="340" fill="#414141">ENAMED → proficientes → acerto → simulados. O teste verifica a ordem no DOM, não só a presença.</text>

    <circle cx="60" cy="368" r="9" fill="#B81414"/><text x="56.5" y="372" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
    <text x="80" y="365" font-weight="700" fill="#111212">O badge “projetado” é obrigatório no ENAMED</text>
    <text x="80" y="382" fill="#414141">É projeção institucional, não o conceito oficial do MEC. Sem o badge, o gestor lê como nota oficial.</text>

    <circle cx="60" cy="410" r="9" fill="#0374AE"/><text x="56.5" y="414" font-size="10" font-weight="700" fill="#FFFFFF">3</text>
    <text x="80" y="407" font-weight="700" fill="#111212">A régua 1º · anterior · atual SOME com 1 simulado só</text>
    <text x="80" y="424" fill="#414141">Com 1 simulado não existe evolução. Com 2, mostra dois pontos. O rótulo é “atual”, nunca “último”.</text>

    <circle cx="60" cy="452" r="9" fill="#149142"/><text x="56.5" y="456" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
    <text x="80" y="449" font-weight="700" fill="#111212">O delta é o dado protagonista, não o valor absoluto</text>
    <text x="80" y="466" fill="#414141">Decisão da reunião de 22/07: o gestor contrata uma linha do tempo, então o que importa é se subiu.</text>

    <circle cx="60" cy="494" r="9" fill="#6632DC"/><text x="56.5" y="498" font-size="10" font-weight="700" fill="#FFFFFF">5</text>
    <text x="80" y="491" font-weight="700" fill="#111212">O “i” abre o TooltipRastreabilidade (Task 36)</text>
    <text x="80" y="508" fill="#414141">Período · Fonte · Atualizado em · Critério. O texto do critério vem do backend, nunca hardcoded.</text>

    <circle cx="60" cy="536" r="9" fill="#D38808"/><text x="56.5" y="540" font-size="10" font-weight="700" fill="#FFFFFF">6</text>
    <text x="80" y="533" font-weight="700" fill="#111212">O 4º card é diferente: sem régua, sem delta</text>
    <text x="80" y="550" fill="#414141">Ele é contagem de contrato (3 de 7), com trilha e link “Ver cronograma” que abre o drawer.</text>

    <circle cx="548" cy="326" r="9" fill="#C61D1D"/><text x="544.5" y="330" font-size="10" font-weight="700" fill="#FFFFFF">7</text>
    <text x="568" y="323" font-weight="700" fill="#111212">Proficiente é 60 OU MAIS</text>
    <text x="568" y="340" fill="#414141">Importe PROFICIENCIA_MINIMA de lib/regras.ts.</text>
    <text x="568" y="356" fill="#414141">Nunca escreva 60 no componente.</text>
    <text x="568" y="380" font-weight="700" fill="#C61D1D">Dado ausente vira — , nunca 0.</text>
    <text x="568" y="396" fill="#414141">Zero é uma afirmação sobre o desempenho.</text>
    <text x="568" y="412" fill="#414141">Traço é a ausência de medida. Trocar um</text>
    <text x="568" y="428" fill="#414141">pelo outro faz o gestor decidir errado.</text>
  </g>
</svg>
