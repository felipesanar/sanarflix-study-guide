<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Inter, Segoe UI, sans-serif" role="img" aria-label="Mapa da tela Início do Gestor, com os blocos e a Task que constrói cada um"><title>Mapa da tela — Início do Gestor</title><desc>Ordem dos blocos da home do gestor e a Task responsável por cada um. Nenhum indicador de desempenho vive nesta tela.</desc><rect width="760" height="440" fill="#EDEEF0"/><text x="28" y="34" font-size="10" font-weight="700" letter-spacing="1.3" fill="#899090">MAPA DA TELA · ordem vertical real</text><text x="28" y="58" font-size="18" font-weight="700" fill="#111212">Início do Gestor</text><text x="28" y="76" font-size="11" fill="#899090">rota /gestor · esta tela ORIENTA, não mede</text><g font-size="12"><g><rect x="28" y="94" width="704" height="40" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="104" width="34" height="20" rx="10" fill="#0374AE"/><text x="47" y="118" font-size="10" font-weight="700" fill="#FFFFFF">34</text><text x="86" y="112" font-weight="700" fill="#111212">Saudação + linha de contexto da IES</text><text x="86" y="127" font-size="11" fill="#414141">Nome da instituição vem de dado. A IES não tem logo no banco — não invente um.</text></g><g><rect x="28" y="142" width="346" height="58" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="40" y="154" width="34" height="20" rx="10" fill="#0374AE"/><text x="47" y="168" font-size="10" font-weight="700" fill="#FFFFFF">34</text><text x="86" y="162" font-weight="700" fill="#111212">Direcionador: Visão Geral</text><text x="42" y="188" font-size="11" fill="#414141">Hover faz prefetch da Visão Geral.</text></g><g><rect x="386" y="142" width="346" height="58" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="398" y="154" width="34" height="20" rx="10" fill="#0374AE"/><text x="405" y="168" font-size="10" font-weight="700" fill="#FFFFFF">34</text><text x="444" y="162" font-weight="700" fill="#111212">Direcionador: Detalhamento</text><text x="400" y="188" font-size="11" fill="#414141">Dois cards grandes, lado a lado.</text></g><g><rect x="28" y="208" width="470" height="130" rx="10" fill="#FFFFFF" stroke="#B81414" stroke-width="1.5"/><rect x="40" y="220" width="48" height="20" rx="10" fill="#B81414"/><text x="47" y="234" font-size="10" font-weight="700" fill="#FFFFFF">31·32</text><text x="100" y="228" font-weight="700" fill="#111212">Cronograma de Simulados</text><text x="100" y="242" font-size="11" font-weight="700" fill="#B81414">é a âncora da tela</text><text x="42" y="264" font-size="11" fill="#414141">Cinco status: realizado · agendado · reagendado ·</text><text x="42" y="279" font-size="11" fill="#414141">previsto · em processamento.</text><text x="42" y="298" font-size="11" fill="#414141">Simulado contratado sem data aparece como</text><text x="42" y="313" font-size="11" fill="#414141">"A definir", com Agendar e Falar com consultor.</text><text x="42" y="330" font-size="11" fill="#899090">Realizado leva ao Detalhamento já filtrado (32).</text></g><g><rect x="510" y="208" width="222" height="130" rx="10" fill="#FFFFFF" stroke="#E9EBED"/><rect x="522" y="220" width="34" height="20" rx="10" fill="#D38808"/><text x="529" y="234" font-size="10" font-weight="700" fill="#FFFFFF">33</text><text x="568" y="234" font-weight="700" fill="#111212">Avisos da Sanar</text><text x="524" y="264" font-size="11" fill="#414141">Máximo 3 + "Ver todos".</text><text x="524" y="282" font-size="11" fill="#414141">Abrir marca como lido,</text><text x="524" y="297" font-size="11" fill="#414141">de forma otimista e com</text><text x="524" y="312" font-size="11" fill="#414141">rollback se falhar.</text></g></g><rect x="28" y="352" width="704" height="72" rx="10" fill="#FFF7F7" stroke="#F3C9C9"/><text x="44" y="372" font-size="11" font-weight="700" fill="#B81414">A rota que junta tudo é a Task 35</text><text x="44" y="389" font-size="11" fill="#414141">Regra que define esta tela: NENHUM indicador de desempenho vive aqui. Sem KPI, sem gráfico,</text><text x="44" y="404" font-size="11" fill="#414141">sem TRI. Quem quer número desce para a Visão Geral. E sem checklist de pendências —</text><text x="44" y="419" font-size="11" fill="#414141">foi descartado de propósito: a home orienta pelo cronograma, não por tarefas.</text></svg>
