
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <title>Guia de Estudos Sanarflix</title>
    <meta name="description" content="Guia de Estudos Personalizado para Medicina - Sanarflix" />
    <meta name="author" content="Sanarflix" />
    
    <!-- Critical CSS Inline - Prevents FOUC -->
    <style>
      /* Critical styles for immediate render */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 221.2 83.2% 53.3%;
        --primary-foreground: 210 40% 98%;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Branded Loading Screen */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, hsl(221.2 83.2% 53.3%), hsl(221.2 83.2% 43.3%));
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 32px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loader-text {
        margin-top: 24px;
        color: white;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      
      /* Prevent flash of unstyled content */
      body:not(.loaded) #root {
        opacity: 0;
      }
      
      body.loaded #root {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }
    </style>
    <!-- DNS Prefetch & Preconnect for critical domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <!-- Preload critical logo image for above-the-fold rendering -->
    <link rel="preload" as="image" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
    <!-- Preload critical modules for faster initial load -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <script>
      // Force React to load first by ensuring vendor chunk is prioritized
      if ('modulepreload' in HTMLLinkElement.prototype) {
        const reactPreload = document.createElement('link');
        reactPreload.rel = 'modulepreload';
        reactPreload.as = 'script';
        document.head.appendChild(reactPreload);
      }
    </script>

    <link rel="icon" type="image/png" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
    <link rel="apple-touch-icon" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />

    <meta property="og:title" content="Guia de Estudos Sanarflix" />
    <meta property="og:description" content="Guia de Estudos Personalizado para Medicina" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sanarflix" />
    <meta name="twitter:image" content="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
  </head>

  <body>
    <!-- Branded Initial Loading Screen -->
    <div class="initial-loader" id="initial-loader">
      <img 
        src="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" 
        alt="Sanarflix Logo" 
        class="loader-logo"
      />
      <div class="loader-spinner"></div>
      <p class="loader-text">Carregando plataforma...</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loader when React is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 500);
          }
          document.body.classList.add('loaded');
        }, 100);
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
