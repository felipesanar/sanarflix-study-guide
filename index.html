
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <title>Guia de Estudos Sanarflix</title>
    <meta name="description" content="Guia de Estudos Personalizado para Medicina - Sanarflix" />
    <meta name="author" content="Sanarflix" />
    <!-- DNS Prefetch & Preconnect for critical domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Critical CSS para prevenir FOUC -->
    <style>
      /* Reset básico */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      /* Previne flash de conteúdo não-estilizado */
      html { 
        background: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      @media (prefers-color-scheme: dark) {
        html { background: #000000; }
      }
      
      body {
        margin: 0;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      
      body.loaded {
        opacity: 1;
      }
      
      /* Previne CLS (Cumulative Layout Shift) */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Skeleton base styles */
      .skeleton-shimmer {
        background: linear-gradient(
          90deg,
          rgba(220, 220, 220, 0.1) 0%,
          rgba(220, 220, 220, 0.3) 50%,
          rgba(220, 220, 220, 0.1) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      
      @media (prefers-color-scheme: dark) {
        .skeleton-shimmer {
          background: linear-gradient(
            90deg,
            rgba(55, 55, 55, 0.1) 0%,
            rgba(55, 55, 55, 0.3) 50%,
            rgba(55, 55, 55, 0.1) 100%
          );
        }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      /* Previne flash branco em transições */
      .page-transition {
        animation: fadeIn 0.3s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <!-- Preload critical logo image for above-the-fold rendering -->
    <link rel="preload" as="image" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
    <!-- Preload critical modules for faster initial load -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <script>
      // Force React to load first by ensuring vendor chunk is prioritized
      if ('modulepreload' in HTMLLinkElement.prototype) {
        const reactPreload = document.createElement('link');
        reactPreload.rel = 'modulepreload';
        reactPreload.as = 'script';
        document.head.appendChild(reactPreload);
      }
    </script>

    <link rel="icon" type="image/png" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
    <link rel="apple-touch-icon" href="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />

    <meta property="og:title" content="Guia de Estudos Sanarflix" />
    <meta property="og:description" content="Guia de Estudos Personalizado para Medicina" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sanarflix" />
    <meta name="twitter:image" content="/lovable-uploads/efb6cdcc-7e6b-4bd1-acc1-0dec71e055ff.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Adiciona classe 'loaded' ao body quando o DOM estiver pronto
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          requestAnimationFrame(() => {
            document.body.classList.add('loaded');
          });
        });
      } else {
        requestAnimationFrame(() => {
          document.body.classList.add('loaded');
        });
      }
    </script>
  </body>
</html>
